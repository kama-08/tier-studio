name: Deploy web

on:
  workflow_run:
    workflows: ['CI']
    types: [completed]
    branches: [main]

permissions:
  contents: read

# Serialize production deployments independently of CI cancellation.
concurrency:
  group: web-production
  cancel-in-progress: false

jobs:
  select-build:
    if: >-
      github.repository == 'kama-08/tier-studio' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      github.event.workflow_run.head_branch == 'main' &&
      (github.event.workflow_run.event == 'push' || github.event.workflow_run.event == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      current: ${{ steps.head.outputs.current }}
    steps:
      - name: Skip builds superseded on main
        id: head
        env:
          GH_TOKEN: ${{ github.token }}
          CHECKED_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          latest_sha="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/main" --jq '.object.sha')"
          if [ "$latest_sha" = "$CHECKED_SHA" ]; then
            echo 'current=true' >> "$GITHUB_OUTPUT"
          else
            echo 'current=false' >> "$GITHUB_OUTPUT"
            echo 'A newer commit is on main; skipping this deployment.'
          fi
  deploy:
    needs: select-build
    if: needs.select-build.outputs.current == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
      deployments: write
    environment:
      name: production
      url: https://tier-studio.kama-08.workers.dev
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - name: Download the build tested by CI
        uses: actions/download-artifact@v4
        with:
          name: web-production-${{ github.event.workflow_run.head_sha }}
          path: dist/web/
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}
      - name: Deploy the tested build
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          DEPLOY_COMMIT: ${{ github.event.workflow_run.head_sha }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo 'Missing production CLOUDFLARE_API_TOKEN secret.'; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo 'Missing production CLOUDFLARE_ACCOUNT_ID variable.'; exit 1; }
          bun ./node_modules/wrangler/wrangler-dist/cli.js deploy --message "$DEPLOY_COMMIT"
      - name: Verify the deployed HTML matches the tested build
        run: bun scripts/verify-web-deployment.ts
        env:
          TEST_BASE_URL: https://tier-studio.kama-08.workers.dev
      - run: bun run test:install --with-deps
      - name: Verify production workflows
        run: bun run test:e2e --workers=2
        env:
          TEST_BASE_URL: https://tier-studio.kama-08.workers.dev
          TEST_PRODUCTION: '1'
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: deployed-browser-test-results-${{ github.run_id }}
          path: test-results/
          retention-days: 7
