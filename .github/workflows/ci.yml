name: CI

on:
  push:
    branches: ['**']
  pull_request:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - run: bun run fmt:check
      - run: bun run lint
      - run: bun run typecheck
      - run: bun run test
      - run: bun run build
      - run: bun run test:install --with-deps
      - run: bun run test:e2e --workers=2
        env:
          TEST_PRODUCTION: '1'
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-test-results
          path: test-results/
          retention-days: 7
  desktop:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          cache-on-failure: true
      - run: bun install --frozen-lockfile
      - run: cargo fmt --manifest-path src-tauri/Cargo.toml --check
      - run: cargo test --manifest-path src-tauri/Cargo.toml --locked
      - name: Describe Windows desktop test environment
        shell: pwsh
        run: |
          $identity = [Security.Principal.WindowsIdentity]::GetCurrent()
          $principal = [Security.Principal.WindowsPrincipal]::new($identity)
          Write-Output "Elevated runner: $($principal.IsInRole([Security.Principal.WindowsBuiltInRole]::Administrator))"
          $runtimeRoots = @(
            (Join-Path ${env:ProgramFiles(x86)} 'Microsoft\EdgeWebView\Application'),
            (Join-Path $env:ProgramFiles 'Microsoft\EdgeWebView\Application'),
            (Join-Path $env:LOCALAPPDATA 'Microsoft\EdgeWebView\Application')
          )
          foreach ($runtimeRoot in $runtimeRoots) {
            if (Test-Path -LiteralPath $runtimeRoot) {
              Get-ChildItem -LiteralPath $runtimeRoot -Directory | ForEach-Object {
                $runtime = Join-Path $_.FullName 'msedgewebview2.exe'
                if (Test-Path -LiteralPath $runtime) {
                  Write-Output "WebView2 runtime: $((Get-Item -LiteralPath $runtime).VersionInfo.ProductVersion)"
                }
              }
            }
          }
      - run: bun run test:desktop
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: native-desktop-results
          path: test-results/
          retention-days: 7
